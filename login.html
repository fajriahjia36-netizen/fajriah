<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Masuk - Jelajah Wisata Majene</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  <!-- CSS Utama -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark navbar-majene">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        Jelajah Majene
      </a>

      <div class="navbar-menu">
        <a class="nav-link" href="index.html">Beranda</a>
        <a class="nav-link" href="wisata.html">Wisata</a>
        <a class="nav-link" href="tentang.html">Tentang</a>
        <a class="nav-link active" href="login.html">Login</a>
      </div>
    </div>
  </nav>

  <!-- Halaman Masuk -->
  <main class="halaman-login">

    <div class="card kartu-login shadow">

      <!-- Judul Card -->
      <div class="card-header judul-login text-center">
        <h3>Login</h3>
        <p class="mb-0">
          Jelajah Wisata Kabupaten Majene
        </p>
      </div>

      <!-- Isi Card -->
      <div class="card-body p-4">

        <!-- Pesan Pemberitahuan -->
        <div class="alert alert-primary" role="alert">
          Silakan masukkan alamat email dan kata sandi Anda.
        </div>

        <!-- Form Masuk -->
        <form id="formLogin">

          <div class="mb-3">
            <label for="email" class="form-label">
              Alamat Email
            </label>

            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Masukkan alamat email"
              required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">
              Kata Sandi
            </label>

            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Masukkan kata sandi"
              minlength="8"
              required>

            <div class="form-text">
              Kata sandi minimal 8 karakter.
            </div>
          </div>

          <button type="submit" class="btn tombol-login w-100">
            Login
          </button>

        </form>

        <!-- Pesan Hasil Form -->
        <div id="pesanLogin" class="mt-3"></div>

        <!-- Kembali ke Beranda -->
        <div class="text-center mt-3">
          <a href="index.html" class="tautan-beranda">
            Kembali ke Beranda
          </a>
        </div>

      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer-majene">
    <div class="container text-center">
      <p class="mb-0">
        &copy; 2026 Jelajah Wisata Kabupaten Majene
      </p>
    </div>
  </footer>

  <!-- JavaScript Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript Form -->
  <script>
    document.getElementById("formLogin").addEventListener("submit", function(event) {
      event.preventDefault();

      const kataSandi = document.getElementById("password").value;
      const pesan = document.getElementById("pesanLogin");

      if (kataSandi.length < 8) {
        pesan.innerHTML = `
          <div class="alert alert-danger" role="alert">
            Kata sandi harus terdiri dari minimal 8 karakter.
          </div>
        `;
        return;
      }

      pesan.innerHTML = `
        <div class="alert alert-success" role="alert">
          Formulir berhasil dikirim!
        </div>
      `;
    });
  </script>

</body>
</html>
